[package]
name = "patchwork-burn-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "autodiff", "flex", "simd", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

